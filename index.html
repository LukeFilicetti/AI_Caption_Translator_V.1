<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caption Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--k:#07000a;--plum:#38003c;--pur:#7a0075;--mag:#bb00bb;--txt:#f6e9f7;--mut:#b99bbd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--txt);font:400 16px/1.55 Sora,system-ui,sans-serif;background:linear-gradient(180deg,var(--k) 0,var(--plum) 60%,#1a001d 100%) fixed}
main{width:100%;max-width:680px;margin:0 auto;padding:40px 20px 24px}
footer{margin-top:auto;padding:0 20px 12px;text-align:center;line-height:0}
footer img{width:min(440px,90%);height:auto}
h1{font:800 clamp(26px,6.5vw,40px)/1.1 Unbounded,system-ui,sans-serif;margin:0 0 12px}
.sub{margin:0 0 28px;color:var(--mut)}
section{margin-bottom:24px}
[hidden]{display:none!important}
.drop{display:block;border:2px dashed var(--mag);border-radius:14px;padding:44px 16px;text-align:center;cursor:pointer;font:600 18px Unbounded,sans-serif;background:rgba(187,0,187,.07)}
.drop:hover,.drop:focus-within{background:rgba(187,0,187,.22)}
.row,.ctl{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.row label,.ctl label{flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
select,input[type=text]{font:inherit;padding:11px;border:1.5px solid var(--pur);border-radius:10px;background:rgba(0,0,0,.45);color:var(--txt);width:100%}
button{font:600 15px Sora,sans-serif;padding:13px 22px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--pur),var(--mag));color:#fff;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;border:1.5px solid var(--pur);color:var(--txt)}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.note{font-size:13px;color:var(--mut)}
progress{width:100%;height:10px;accent-color:var(--mag)}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;max-width:360px;margin:0 auto 16px;border:1px solid var(--pur)}
.stage video{width:100%;display:block;max-height:70vh}
#cap{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);width:86%;text-align:center;color:#fff;font-weight:800;font-size:18px;line-height:1.25;text-shadow:0 0 4px #000,0 0 4px #000,0 0 2px #000;cursor:grab;touch-action:none;user-select:none}
.ctl input{accent-color:var(--mag);width:100%}
ol{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
li{display:flex;gap:8px;align-items:center}
button.t{padding:8px 10px;font-size:13px;background:rgba(122,0,117,.5);min-width:72px}
#lang{position:relative;display:flex;justify-content:flex-end;margin-bottom:20px}
#lang button{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px}
#lang ul{position:absolute;right:0;top:100%;margin:6px 0 0;padding:6px;list-style:none;background:#14001a;border:1.5px solid var(--pur);border-radius:12px;max-height:60vh;overflow:auto;z-index:5;min-width:210px}
#lang li button{width:100%;border:0;background:transparent;text-align:left}
#lang li button:hover,#lang li button[aria-selected=true]{background:rgba(187,0,187,.3)}
#lang svg{width:22px;height:15px;border-radius:2px;flex:none}
</style></head><body><main>
<nav id="lang" aria-label="Language"></nav>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="sub"></p>

<section id="setup">
  <label class="drop"><input type="file" id="file" accept="video/*" hidden><span id="fname"></span></label>
  <div class="row">
    <label><span data-i18n="from"></span><select id="from"></select></label>
    <label><span data-i18n="to"></span><select id="to"></select></label>
  </div>
  <button id="go" data-i18n="go" disabled></button>
  <p class="note" data-i18n="privacy"></p>
</section>

<section id="status" hidden>
  <p id="msg" role="status"></p>
  <progress id="bar" max="100" hidden></progress>
  <button id="cancel" class="ghost" data-i18n="cancel"></button>
</section>

<section id="result" hidden>
  <div class="stage"><video id="vid" controls playsinline></video><div id="cap"></div></div>
  <div class="ctl"><label><span data-i18n="size"></span><input type="range" id="ps" min="50" max="220" value="100"></label><label><span data-i18n="lr"></span><input type="range" id="px" min="10" max="90" value="50"></label><label><span data-i18n="ud"></span><input type="range" id="py" min="8" max="95" value="78"></label><button id="rst" class="ghost" data-i18n="reset"></button></div>
  <p class="note" data-i18n="drag"></p>
  <ol id="list"></ol>
  <div class="row"><button id="exp" data-i18n="exp"></button><button id="srt" class="ghost" data-i18n="srt"></button></div>
  <div class="row"><button id="sv" data-i18n="sv" hidden></button></div>
  <p id="expmsg" class="note" role="status"></p>
</section>
</main>
<footer><!-- Paste your original footer image here: <img src="data:image/png;base64,..." alt=""> --></footer>

<script type="module">
// 1) After deploying the Cloudflare Worker, paste its URL here:
const WORKER = "https://caption-translate.ai-translation-studio.workers.dev/";

const LANGS = [["portuguese","pt"],["english","en"],["spanish","es"],["french","fr"],["german","de"],["italian","it"],["japanese","ja"],["korean","ko"],["chinese","zh"],["russian","ru"],["arabic","ar"],["hindi","hi"]];
// Interface text. Only English is here: other languages are translated once by the Worker (Gemini) and cached on the device.
// To keep your hand-written pt/es/fr/de/... text, paste your original "pt" and "es" entries into T below, and your original Object.assign(T, {...}) block right after it.
const T = {"en": {"title": "Translate your video's captions", "sub": "Upload a Reel, pick the languages, and get captions that translate meaning and tone instead of word for word.", "choose": "Choose a video", "from": "Spoken language", "to": "Translate to", "go": "Translate captions", "privacy": "Speech is transcribed on your device. Only the caption text is sent to Google's Gemini API (free tier) for translation, and Google may use it to improve its products.", "cancel": "Cancel", "size": "Size", "lr": "Left / right", "ud": "Up / down", "reset": "Reset", "drag": "You can also drag the caption on the video.", "exp": "Export video with captions", "srt": "Download SRT", "dl": "Downloading speech model (first time only)…", "tr": "Transcribing speech…", "reading": "Reading audio…", "rt": "Reading audio in real time. Keep this tab open…", "rtp": "Reading audio in real time… {a}s of {b}s", "transl": "Translating with Gemini…", "rate": "Rate limits have been reached for the minute. Please wait a moment for them to recover. Translation paused until rates recover. Resuming in {s}s…", "nospeech": "No speech found in this video.", "fail": "Translation failed ({n}). Refresh and try again.", "err": "Something went wrong. Refresh to try again.", "cant": "This browser can't read the audio of this video.", "exping": "Exporting in real time. Keep this tab open until it finishes.", "done": "Done. Your video was saved.", "sv": "Save video", "ready": "Your video is ready. Tap Save video."}};
const $ = id => document.getElementById(id);
let L = "en";
const t = (k, v = {}) => (T[L]?.[k] ?? T.en[k]).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? "");
const R = (c, v) => c.map((f, i) => v ? `<rect x="${i * 8}" width="8" height="16" fill="${f}"/>` : `<rect y="${i * 16 / c.length}" width="24" height="${16 / c.length}" fill="${f}"/>`).join("");
const S = b => `<svg viewBox="0 0 24 16" aria-hidden="true">${b}</svg>`;
const FL = {
  en: S(`<rect width="24" height="16" fill="#fff"/>${[0,1,2,3,4,5,6].map(i => `<rect y="${i * 2.46}" width="24" height="1.23" fill="#b22234"/>`).join("")}<rect width="10" height="8.6" fill="#3c3b6e"/>`),
  pt: S('<rect width="24" height="16" fill="#009b3a"/><path d="M12 1.5L22 8L12 14.5L2 8z" fill="#fedf00"/><circle cx="12" cy="8" r="3.2" fill="#002776"/>'),
  es: S('<rect width="24" height="16" fill="#c60b1e"/><rect y="4" width="24" height="8" fill="#ffc400"/>'),
  fr: S(R(["#0055a4", "#fff", "#ef4135"], 1)),
  de: S(R(["#000", "#dd0000", "#ffce00"])),
  it: S(R(["#009246", "#fff", "#ce2b37"], 1)),
  ja: S('<rect width="24" height="16" fill="#fff"/><circle cx="12" cy="8" r="4.5" fill="#bc002d"/>'),
  ko: S('<rect width="24" height="16" fill="#fff"/><path d="M7.5 8a4.5 4.5 0 0 1 9 0z" fill="#cd2e3a"/><path d="M7.5 8a4.5 4.5 0 0 0 9 0z" fill="#0047a0"/>'),
  zh: S('<rect width="24" height="16" fill="#de2910"/><path d="M5 2.5l1.1 3.3h3.4l-2.8 2 1 3.3L5 9.1l-2.7 2 1-3.3-2.8-2h3.4z" fill="#ffde00"/>'),
  ru: S(R(["#fff", "#0039a6", "#d52b1e"])),
  ar: S('<rect width="24" height="16" fill="#006c35"/><rect x="5" y="10.5" width="14" height="1.2" fill="#fff"/>'),
  hi: S(R(["#ff9933", "#fff", "#138808"]) + '<circle cx="12" cy="8" r="2" fill="none" stroke="#000080" stroke-width=".6"/>')
};
const NATIVE = c => new Intl.DisplayNames([c], { type: "language" }).of(c).replace(/^./, m => m.toLocaleUpperCase(c));
const chip = c => FL[c] + `<span>${NATIVE(c)}</span>`;
{
  const nav = $("lang"), btn = document.createElement("button"), ul = document.createElement("ul"), close = () => { ul.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.className = "ghost"; btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false"); ul.setAttribute("role", "listbox"); ul.hidden = true;
  for (const [, c] of LANGS) { const li = document.createElement("li"), b = document.createElement("button"); b.className = "ghost"; b.dataset.l = c; b.innerHTML = chip(c); b.onclick = () => { close(); setLang(c); }; li.append(b); ul.append(li); }
  btn.onclick = () => { ul.hidden = !ul.hidden; btn.setAttribute("aria-expanded", String(!ul.hidden)); };
  addEventListener("click", e => { if (!nav.contains(e.target)) close(); });
  addEventListener("keydown", e => { if (e.key === "Escape") { close(); btn.focus(); } });
  nav.append(btn, ul);
}
// Languages without hand-written text are translated once by the Worker (Gemini) and cached on the device.
async function loadUI(l) {
  if (T[l]) return;
  let c; try { c = JSON.parse(localStorage.getItem("ui_" + l)); } catch {}
  if (!c) {
    const ks = Object.keys(T.en);
    try {
      const r = await fetch(WORKER, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: "english", to: LANGS.find(x => x[1] === l)[0], lines: ks.map(k => T.en[k]) }) });
      if (r.ok) {
        const { lines } = await r.json(); c = {};
        ks.forEach((k, i) => { const o = String(lines[i] ?? ""); c[k] = (T.en[k].match(/\{\w+\}/g) || []).every(p => o.includes(p)) && o ? o : T.en[k]; });
        try { localStorage.setItem("ui_" + l, JSON.stringify(c)); } catch {}
      }
    } catch {}
  }
  if (c) T[l] = c;
}
function fill() {
  for (const [id, d] of [["from", "portuguese"], ["to", "english"]]) {
    const cur = $(id).value || d, dn = new Intl.DisplayNames([L], { type: "language" });
    $(id).innerHTML = LANGS.map(([v, c]) => `<option value="${v}">${dn.of(c).replace(/^./, m => m.toLocaleUpperCase(L))}</option>`).join("");
    $(id).value = cur;
  }
}
async function setLang(l) {
  await loadUI(l); L = l; try { localStorage.setItem("lang", l); } catch {}
  document.documentElement.lang = l === "pt" ? "pt-BR" : l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  if (!file) $("fname").textContent = t("choose");
  $("lang").firstChild.innerHTML = chip(l) + "<span>▾</span>";
  document.querySelectorAll("#lang li button").forEach(b => b.setAttribute("aria-selected", b.dataset.l === l));
  fill();
}

let file, segs = [], asr;
{ let sv; try { sv = localStorage.getItem("lang"); } catch {}
  const nl = (navigator.language || "en").slice(0, 2); setLang(LANGS.some(x => x[1] === sv) ? sv : T[nl] ? nl : "en"); }
const show = (id, v) => $(id).hidden = !v;
const say = (t, p) => { $("msg").textContent = t; $("bar").hidden = p == null; if (p != null) $("bar").value = p; };
$("cancel").onclick = () => { try { localStorage.removeItem("asr_busy"); } catch {} location.reload(); };

$("file").onchange = e => {
  file = e.target.files[0]; if (!file) return;
  $("fname").textContent = file.name; $("go").disabled = false;
  $("vid").src = URL.createObjectURL(file);
};

// Whisper needs 16 kHz mono. Phones are pickier than desktops, so try several ways, simplest first.
const AC = () => window.AudioContext || window.webkitAudioContext;
function to16k(buf) { // manual downsample (average each window) for browsers that won't decode at 16 kHz directly
  const n = buf.numberOfChannels, len = buf.length, ratio = buf.sampleRate / 16000, ch = [];
  for (let c = 0; c < n; c++) ch.push(buf.getChannelData(c));
  const out = new Float32Array(Math.floor(len / ratio));
  for (let i = 0; i < out.length; i++) {
    const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(len, Math.floor((i + 1) * ratio)));
    let sum = 0; for (let c = 0; c < n; c++) for (let k = a; k < b; k++) sum += ch[c][k];
    out[i] = sum / ((b - a) * n);
  }
  return out;
}
async function decode16k(f) {
  try { // 1) let the browser decode straight to 16 kHz
    const ctx = new (AC())({ sampleRate: 16000 }), b = await ctx.decodeAudioData(await f.arrayBuffer());
    ctx.close?.(); return b.sampleRate === 16000 ? b.getChannelData(0) : to16k(b);
  } catch (e) { console.warn("16 kHz decode failed, retrying at native rate", e); }
  const ctx = new (AC())(), b = await ctx.decodeAudioData(await f.arrayBuffer()); // 2) native rate, then downsample ourselves
  ctx.close?.(); return to16k(b);
}
const ADTS_RATES = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => no(new Error("mp4box failed to load"));
    document.head.append(s);
  });
}
async function aacOf(f) { // pull the AAC track out of the MP4/MOV and wrap it as ADTS so the browser can decode it fast
  if (!window.MP4Box) await loadScript("https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js");
  const buf = await f.arrayBuffer(); buf.fileStart = 0;
  const mp4 = MP4Box.createFile(), parts = []; let tr, err;
  mp4.onError = e => err = e;
  mp4.onReady = info => {
    tr = info.audioTracks[0];
    if (!tr || tr.codec !== "mp4a.40.2") return;
    mp4.setExtractionOptions(tr.id, null, { nbSamples: 1000 }); mp4.start();
  };
  mp4.onSamples = (id, user, samples) => {
    const ch = tr.audio.channel_count, r = ADTS_RATES.indexOf(tr.audio.sample_rate);
    for (const s of samples) {
      const n = s.size + 7, h = new Uint8Array(7);
      h[0] = 0xFF; h[1] = 0xF1; h[2] = (1 << 6) | (r << 2) | (ch >> 2);
      h[3] = ((ch & 3) << 6) | (n >> 11); h[4] = (n >> 3) & 255; h[5] = ((n & 7) << 5) | 0x1F; h[6] = 0xFC;
      parts.push(h, s.data);
    }
  };
  mp4.appendBuffer(buf); mp4.flush();
  if (err) throw new Error("mp4 parse error");
  if (!tr || tr.codec !== "mp4a.40.2") throw new Error("audio is not AAC-LC (" + (tr ? tr.codec : "no audio track") + ")");
  if (ADTS_RATES.indexOf(tr.audio.sample_rate) < 0 || !parts.length) throw new Error("no usable audio samples");
  return new Blob(parts, { type: "audio/aac" });
}
async function audioOf(f) {
  let e1;
  try { return await decode16k(f); } catch (e) { e1 = e; console.warn("Direct audio decode failed", e); }
  try { return await decode16k(await aacOf(f)); }
  catch (e2) { // slow last resort; the bracket shows why both fast paths failed
    console.warn("AAC extraction failed", e2);
    const n = e => e && (e.name || e.message);
    return await listen(f, "v2 direct: " + n(e1) + " | aac: " + n(e2));
  }
}
async function listen(f, why = "") { // last resort: play the video and record its audio in real time
  say(t("rt") + (why ? " [" + why + "]" : ""));
  const until = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error(t("cant"))), ms))]);
  const m = document.createElement("video"); m.playsInline = true; m.setAttribute("playsinline", ""); m.preload = "auto";
  m.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
  document.body.append(m); m.src = URL.createObjectURL(f);
  try {
    await until(new Promise((ok, no) => { m.onloadedmetadata = ok; m.onerror = () => no(new Error(t("cant"))); }), 20000);
    const ac = new (AC())(), d = ac.createMediaStreamDestination(); ac.createMediaElementSource(m).connect(d);
    if (typeof MediaRecorder === "undefined") throw new Error(t("cant"));
    const rec = new MediaRecorder(d.stream), ch = []; rec.ondataavailable = e => ch.push(e.data);
    const done = new Promise(r => rec.onstop = r); m.onended = () => rec.stop();
    rec.start(); await ac.resume(); await until(m.play(), 15000);
    const tm = setInterval(() => say(t("rtp", { a: Math.round(m.currentTime), b: Math.round(m.duration) })), 500);
    await done; clearInterval(tm);
    return await decode16k(new Blob(ch));
  } finally { URL.revokeObjectURL(m.src); m.remove(); }
}

// Speech models, biggest to smallest. Phones start one step down; if a tab ever crashes mid-load, the next try steps down again.
const ASR = ["onnx-community/whisper-small", "onnx-community/whisper-base", "onnx-community/whisper-tiny"];
const isPhone = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform || navigator.userAgent));
function pickModel() {
  let i, busy; try { i = parseInt(localStorage.getItem("asr_idx")); busy = localStorage.getItem("asr_busy"); } catch {}
  if (!(i >= 0 && i < ASR.length)) i = isPhone() ? 1 : 0;
  if (busy != null) i = Math.min(ASR.length - 1, (parseInt(busy) || 0) + 1); // last attempt never finished = the tab crashed
  try { localStorage.setItem("asr_idx", i); localStorage.setItem("asr_busy", i); } catch {}
  return i;
}
const asrDone = () => { try { localStorage.removeItem("asr_busy"); } catch {} };
addEventListener("pagehide", e => { if (!e.persisted) asrDone(); }); // a normal refresh is not a crash

async function transcribe(audio) {
  const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3");
  const i = pickModel(), gpu = !!navigator.gpu && i === 0 && !isPhone();
  console.log("Speech model:", ASR[i]);
  asr = await pipeline("automatic-speech-recognition", ASR[i], {
    device: gpu ? "webgpu" : "wasm",
    dtype: gpu ? { encoder_model: "fp32", decoder_model_merged: "q4" } : "q8",
    progress_callback: p => { if (p.status === "progress") say(t("dl"), p.progress); }
  });
  say(t("tr"));
  try {
    const out = await asr(audio, { language: $("from").value, task: "transcribe", chunk_length_s: 30, stride_length_s: 5, return_timestamps: true });
    return out.chunks.map(c => ({ s: c.timestamp[0], e: c.timestamp[1] ?? c.timestamp[0] + 2, src: c.text.trim(), text: "" })).filter(x => x.src);
  } finally { asrDone(); }
}

const wait = async s => {
  for (; s > 0; s--) {
    say(t("rate", { s }));
    await new Promise(r => setTimeout(r, 1000));
  }
};

async function translate() {
  for (let tries = 0; ; tries++) {
    const r = await fetch(WORKER, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: $("from").value, to: $("to").value, lines: segs.map(s => s.src) }) });
    if (r.status === 429) {
      const o = await r.json().catch(() => ({}));
      // Waiting only helps for short per-minute limits; give up with the real reason instead of looping forever.
      if (tries >= 2 || (o.retry || 60) > 120) throw new Error(t("fail", { n: 429 }) + " [" + [o.source, o.detail].filter(Boolean).join(" | ") + "]");
      await wait(o.retry || 60); continue;
    }
    if (!r.ok) {
      const body = await r.text().catch(() => ""); console.error("Worker error", r.status, body);
      let d = ""; try { const o = JSON.parse(body); d = [o.error, o.status, o.finishReason, o.detail || o.raw, o.got != null ? o.got + "/" + o.expected + " lines" : "", o.ms != null ? o.ms + "ms" : ""].filter(Boolean).join(" | "); } catch { d = body.slice(0, 200); }
      throw new Error(t("fail", { n: r.status }) + (d ? " [" + d + "]" : ""));
    }
    return (await r.json()).lines;
  }
}

$("go").onclick = async () => {
  if (WORKER.startsWith("PASTE")) { alert("Set the WORKER URL at the top of the script first."); return; }
  show("setup", 0); show("status", 1); say(t("reading"));
  try {
    segs = await transcribe(await audioOf(file));
    if (!segs.length) throw new Error(t("nospeech"));
    say(t("transl"));
    const out = await translate();
    segs.forEach((s, i) => s.text = out[i] || s.src);
    render(); show("status", 0); show("result", 1); place();
  } catch (e) { say(e.message || t("err")); $("bar").hidden = true; }
};

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function render() {
  $("list").innerHTML = "";
  segs.forEach(s => {
    const li = document.createElement("li"), b = document.createElement("button"), i = document.createElement("input");
    b.className = "t"; b.textContent = fmt(s.s); b.onclick = () => { $("vid").currentTime = s.s; $("vid").play(); };
    i.type = "text"; i.value = s.text; i.oninput = () => s.text = i.value;
    li.append(b, i); $("list").append(li);
  });
}
const P = { x: 50, y: 78, s: 100 }, K = ["x", "y", "s"];
function place() { const c = $("cap"); c.style.left = P.x + "%"; c.style.top = P.y + "%"; c.style.width = Math.min(86, 2 * Math.min(P.x, 100 - P.x)) + "%"; c.style.fontSize = c.parentElement.clientWidth * .065 * P.s / 100 + "px"; }
for (const k of K) $("p" + k).oninput = e => { P[k] = +e.target.value; place(); };
$("rst").onclick = () => { Object.assign(P, { x: 50, y: 78, s: 100 }); for (const k of K) $("p" + k).value = P[k]; place(); };
$("cap").onpointerdown = e => {
  const r = $("cap").parentElement.getBoundingClientRect(), cl = (v, a, b) => Math.min(b, Math.max(a, v));
  const mv = ev => { P.x = cl((ev.clientX - r.left) / r.width * 100, 10, 90); P.y = cl((ev.clientY - r.top) / r.height * 100, 8, 95); $("px").value = P.x; $("py").value = P.y; place(); };
  const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); };
  addEventListener("pointermove", mv); addEventListener("pointerup", up); e.preventDefault();
};
addEventListener("resize", place);
const at = t => segs.find(s => t >= s.s && t < s.e);
$("vid").ontimeupdate = () => $("cap").textContent = at($("vid").currentTime)?.text || "";

const ts = t => { const m = Math.round(t * 1000), p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(m / 36e5 | 0)}:${p(m / 6e4 % 60 | 0)}:${p(m / 1e3 % 60 | 0)},${p(m % 1e3, 3)}`; };
const save = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };
$("srt").onclick = () => save(new Blob([segs.map((s, i) => `${i + 1}\n${ts(s.s)} --> ${ts(s.e)}\n${s.text}\n`).join("\n")], { type: "text/plain" }), "captions.srt");

function caption(x, t, w, h) {
  const f = Math.round(w * .065 * P.s / 100), cx = w * P.x / 100, mw = Math.min(w * .86, 2 * Math.min(cx, w - cx));
  x.font = `800 ${f}px Sora,system-ui,sans-serif`; x.textAlign = "center"; x.lineJoin = "round"; x.lineWidth = f / 5;
  x.strokeStyle = "#000"; x.fillStyle = "#fff";
  const ls = []; let c = "";
  for (const q of t.split(" ")) { const n = c ? c + " " + q : q; if (x.measureText(n).width > mw && c) { ls.push(c); c = q; } else c = n; }
  ls.push(c);
  let y = h * P.y / 100 - (ls.length - 1) * f * .625 + f * .35;
  for (const l of ls) { x.strokeText(l, cx, y); x.fillText(l, cx, y); y += f * 1.25; }
}

$("exp").onclick = async () => {
  const v = $("vid"), w = v.videoWidth, h = v.videoHeight, cv = document.createElement("canvas"), x = cv.getContext("2d");
  cv.width = w; cv.height = h;
  const ac = new AudioContext(), dest = ac.createMediaStreamDestination();
  ac.createMediaElementSource(v).connect(dest);
  // Match the source bitrate (file size / duration) with some headroom, instead of a fixed 8 Mbps cap.
  const bps = Math.min(5e7, Math.max(8e6, Math.round(file.size * 8 / v.duration * 1.3)));
  const mime = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: mime, videoBitsPerSecond: bps, audioBitsPerSecond: 192e3 });
  const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime }), name = "captioned." + (mime.startsWith("video/mp4") ? "mp4" : "webm"), out = new File([blob], name, { type: mime.split(";")[0] });
    $("sv").hidden = false;
    $("sv").onclick = async () => { // phones need the share sheet (a fresh tap) to put the video in Photos
      try { if (navigator.canShare?.({ files: [out] })) { await navigator.share({ files: [out] }); return; } }
      catch (e) { if (e.name === "AbortError") return; }
      save(blob, name); // desktop or unsupported browsers: normal download
    };
    $("expmsg").textContent = t("ready"); $("exp").disabled = false;
  };
  $("exp").disabled = true; $("sv").hidden = true; v.pause(); v.currentTime = 0; await new Promise(r => v.onseeked = r);
  $("expmsg").textContent = t("exping");
  const draw = () => { x.drawImage(v, 0, 0, w, h); const s = at(v.currentTime); if (s) caption(x, s.text, w, h); if (!v.ended) requestAnimationFrame(draw); };
  v.onended = () => rec.stop(); rec.start(); await ac.resume(); await v.play(); draw();
};
